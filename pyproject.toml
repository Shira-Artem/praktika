[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-analytics-pipeline"
version = "0.1.0"
description = "Containerized backend pipeline for collecting and storing game analytics events."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.10,<1.0",
    "clickhouse-connect>=0.7,<1.0",
    "fastapi>=0.115,<1.0",
    "orjson>=3.10,<4.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
    "testcontainers>=4.7,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analytics_api = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: full Docker-backed end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
